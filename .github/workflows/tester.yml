name: EvalBot tester
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tester/requirements.txt
      - run: python -m compileall -q tester
      - run: cd tester && python -m unittest discover -p 'test_*.py' -v
