name: EvalBot tester
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tester/requirements.txt
      - run: python -m compileall -q tester
      - run: python -m unittest discover -p "test_*.py" -v
        working-directory: tester
